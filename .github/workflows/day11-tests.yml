name: Day 11 forecasting-feasibility tests

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_forecasting_feasibility.py"
      - "tests/test_audit_forecasting_feasibility.py"
      - ".github/workflows/day11-tests.yml"
  pull_request:
    paths:
      - "scripts/audit_forecasting_feasibility.py"
      - "tests/test_audit_forecasting_feasibility.py"
      - ".github/workflows/day11-tests.yml"

jobs:
  day11-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q tests/test_audit_forecasting_feasibility.py
