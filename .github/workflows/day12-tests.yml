name: Day 12 inference-pipeline tests

on:
  push:
    branches: [main]
    paths:
      - "scripts/predict.py"
      - "tests/test_predict.py"
      - ".github/workflows/day12-tests.yml"
      - "requirements.txt"
  pull_request:
    paths:
      - "scripts/predict.py"
      - "tests/test_predict.py"
      - ".github/workflows/day12-tests.yml"
      - "requirements.txt"

jobs:
  day12-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q tests/test_predict.py
      - run: python -m py_compile scripts/predict.py
      - run: python scripts/predict.py --help
