dataset:
  name: "Early detection of Septoria infection on wheat leaves using hyperspectral imaging data"
  doi: "10.57745/WVP0FJ"
  persistent_id: "doi:10.57745/WVP0FJ"
  dataverse_api: "https://entrepot.recherche.data.gouv.fr/api"
  metadata_dir: "data/metadata"
  selected_metadata_files:
    - "Data_description.csv"
    - "VNIR_data.csv"
    - "SWIR_data.csv"

experimental_design:
  pot_count: 48
  genotypes: ["EPO_067", "EPO_068"]
  pots_per_genotype: 24
  infected_pots_per_genotype: 12
  non_infected_pots_per_genotype: 12
  plants_per_pot: 6
  plants_per_side: 3
  treatment_assignment_unit: "pot"
  conservative_validation_group: "pot_id"
  folder_date_format: "YYYYMMDD"
  pot_side_pattern: "{pot_number}_{side}"
  side_codes:
    D: "right"
    G: "left"
  inoculation_date_candidate: "2021-03-12"
  inoculation_date_status: "provisional; confirm against annotation CSVs and all archive dates"

hsi:
  format: "ENVI"
  binary_extension: ".hyspex"
  header_extension: ".hdr"
  published_hyspex_dark_current_corrected: true
  reflectance_standard: "Spectralon SRS99"
  sensor_profiles:
    VNIR:
      sensor: "HySpex VNIR-1800"
      expected_bands: 216
      expected_wavelength_range_nm: [411, 993]
      paper_reported_nominal_shape: [1370, 1024]
    SWIR:
      sensor: "HySpex SWIR-384"
      expected_bands: 256
      expected_wavelength_range_nm: [964, 2494]
      paper_reported_nominal_shape: [420, 320]
  calibration:
    raw_intensity_formula: "(sample - dark) / (white - dark)"
    published_hyspex_formula: "sample_dark_corrected / white_dark_corrected"
    do_not_subtract_dark_twice: true
    white_reference_roi_or_file: "must be identified and validated from the actual archive"
    certified_standard_curve: "apply only if available and wavelength-aligned; otherwise document unity-reference assumption"

research:
  initial_task: "dataset_inventory_and_metadata_validation"
  forecasting_claim_allowed: false
  note: "Reassess forecasting feasibility only after validating temporal labels, repeated sample identities and future outcomes. Do not infer genotype/treatment from pot-number ranges."
