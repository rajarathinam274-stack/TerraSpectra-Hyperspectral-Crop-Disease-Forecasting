name: Day 10 early-detection tests

on:
  push:
    branches: [main]
    paths:
      - "scripts/analyze_early_detection.py"
      - "tests/test_analyze_early_detection.py"
      - ".github/workflows/day10-tests.yml"
  pull_request:
    paths:
      - "scripts/analyze_early_detection.py"
      - "tests/test_analyze_early_detection.py"
      - ".github/workflows/day10-tests.yml"

jobs:
  day10-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q tests/test_analyze_early_detection.py
